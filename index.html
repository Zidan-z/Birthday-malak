<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
	<title>عيد ميلاد سعيد ملاكك 🎉</title>
	<meta charset="UTF-8" />
	<meta name="description" content="عيد ميلاد سعيد">
	<meta name="robots" content="index, follow" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, minimum-scale=1.0, maximum-scale=1.0">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black">
	<meta http-equiv="X-UA-Compatible" content="IE=9; IE=8; IE=7; IE=EDGE" />
	
	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.1/css/bootstrap.min.css">
	<link rel="stylesheet" type="text/css" href="stylesheet.css">
	<link rel="stylesheet" type="text/css" href="loading.css">
	<link href='https://fonts.googleapis.com/css?family=Cairo' rel='stylesheet' type='text/css'>
	<link rel="stylesheet/less" href="cake.less">
	<script src="https://cdnjs.cloudflare.com/ajax/libs/less.js/2.1.0/less.min.js"></script>
	
	<style>
		body, p, button, h2 {
			font-family: 'Cairo', sans-serif !important;
		}

		/* تنسيق الصور المعلقة في الاتجاهات الأربعة */
		.corner-photo {
			position: fixed;
			z-index: 99999;
			width: 140px;
			text-align: center;
			opacity: 0;
			pointer-events: none;
			transition: all 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
		}

		.corner-photo .string {
			width: 2px;
			background: #e91e63;
			margin: 0 auto;
			box-shadow: 0 0 5px rgba(233, 30, 99, 0.5);
		}

		.corner-photo .img-card {
			background: #ffffff;
			padding: 8px 8px 12px 8px;
			border-radius: 8px;
			box-shadow: 0 8px 25px rgba(0,0,0,0.5);
			border: 2px solid #e91e63;
		}

		.corner-photo img {
			width: 100%;
			height: 120px;
			object-fit: cover;
			border-radius: 4px;
		}

		/* التموضعات للأركان الأربعة */
		.top-left-photo { top: -300px; left: 20px; transform: rotate(-6deg); }
		.top-left-photo .string { height: 60px; }

		.top-right-photo { top: -300px; right: 20px; transform: rotate(6deg); }
		.top-right-photo .string { height: 60px; }

		.bottom-left-photo { bottom: -300px; left: 20px; transform: rotate(5deg); }
		.bottom-left-photo .string { height: 80px; }

		.bottom-right-photo { bottom: -300px; right: 20px; transform: rotate(-5deg); }
		.bottom-right-photo .string { height: 80px; }

		/* عند ظهور الصور بعد الضغط */
		.corner-photo.show-photo {
			opacity: 1;
		}
		.top-left-photo.show-photo { top: 0px; }
		.top-right-photo.show-photo { top: 0px; }
		.bottom-left-photo.show-photo { bottom: 0px; }
		.bottom-right-photo.show-photo { bottom: 0px; }
	</style>
</head>

<body>
	<div class="loading"></div>

	<!-- الصور الأربعة المعلقة في الأركان الأربعة -->
	<div class="corner-photo top-left-photo" id="photo1">
		<div class="string"></div>
		<div class="img-card"><img src="77.jpg" alt="Photo 77"></div>
	</div>

	<div class="corner-photo top-right-photo" id="photo2">
		<div class="string"></div>
		<div class="img-card"><img src="7.png" alt="Photo 7"></div>
	</div>

	<div class="corner-photo bottom-left-photo" id="photo3">
		<div class="string"></div>
		<div class="img-card"><img src="mo.png" alt="Photo mo"></div>
	</div>

	<div class="corner-photo bottom-right-photo" id="photo4">
		<div class="string"></div>
		<div class="img-card"><img src="bre.png" alt="Photo bre"></div>
	</div>

	<!-- ملف الأغنية الصوتية -->
	<audio class="song" controls loop>
        <source src="song.mp3"></source>
	    متصفحك لا يدعم تشغيل الصوت.
    </audio>

	<!-- البالونات الملونة بالحروف -->
    <div class="balloons text-center" id="b1">
    	<h2 style="color:#F2B300;">عـ</h2>
    </div>
    <div class="balloons text-center" id="b2">
    	<h2 style="color:#0719D4;">يـ</h2>
    </div>
	<div class="balloons text-center" id="b3">
    	<h2 style="color:#D14D39;">د</h2>
    </div>
	<div class="balloons text-center" id="b4">
    	<h2 style="color:#8FAD00;">مـ</h2>
    </div>
	<div class="balloons text-center" id="b5">
    	<h2 style="color:#8377E4;">يـ</h2>
    </div>
    <div class="balloons text-center" id="b6">
    	<h2 style="color:#99C96A;">لـ</h2>
    </div>
    <div class="balloons text-center" id="b7">
    	<h2 style="color:#20CFB4;">اد</h2>
    </div>

    <img src="Balloon-Border.png" width="100%" class="balloon-border">

	<div class="container">
		
		<!-- اللمبات والإضاءة -->
		<div class="row">
			<div class="col-md-2 col-xs-2 bulb-holder">
				<div class="bulb" id="bulb_yellow"></div>
			</div>
			<div class="col-md-2 col-xs-2 bulb-holder">
				<div class="bulb" id="bulb_red"></div>
			</div>
			<div class="col-md-2 col-xs-2 bulb-holder">
				<div class="bulb" id="bulb_blue"></div>
			</div>
			<div class="col-md-2 col-xs-2 bulb-holder">
				<div class="bulb" id="bulb_green"></div>
			</div>
			<div class="col-md-2 col-xs-2 bulb-holder">
				<div class="bulb" id="bulb_pink"></div>
			</div>
			<div class="col-md-2 col-xs-2 bulb-holder">
				<div class="bulb" id="bulb_orange"></div>
			</div>
		</div>

		<!-- زينة البانر -->
		<div class="row">
			<div class="col-md-12 text-center">
				<img src="banner.png" class="bannar">
			</div>
		</div>

		<!-- التورتة والشمع -->
		<div class="row cake-cover">
			<div class="col-md-12 text-center">
				<div class="cake">
				  <div class="velas">
				    <div class="fuego"></div>
				    <div class="fuego"></div>
				    <div class="fuego"></div>
				    <div class="fuego"></div>
				    <div class="fuego"></div>
				  </div>
				  <div class="cobertura"></div>
				  <div class="bizcocho"></div>
				</div>
			</div>
		</div>

		<!-- الرسالة المكتوبة (نفس كلامك بالظبط) -->
		<div class="row message">
			<div class="col-md-12">
				<p>كل عام و انتي</p>
				<p>بخير و بصحه و سلامه</p>
				<p>أتمنالك سنة جديدة مليانة نجاح وسعادة</p>
				<p>ويارب كل أحلامك امانيك تتحقق</p>
				<p>الله يوفقك بشغلك و دراستك يارب </p>
				<p> بتضلي عزيزه على قلبي يا </p>
				<p> زانيتي المفضله وزنديقتي المفضله</p>
				<p>المهم استمتعي بيومك لوبنانيتي المفضله</p>
				<p>كل عام و انتي بخير ملاكيي! 🎉</p>
			</div>
		</div>

		<!-- شريط الأزرار التفاعلي في الأسفل -->
		<div class="navbar navbar-fixed-bottom">
			<div class="row">
				<div class="col-md-6 text-center col-md-offset-3">
					<button class="btn btn-primary" id="turn_on">شغّلي النور يا لوبنانيه 💡</button>
					<button class="btn btn-primary" id="play">شغّلي الاغنيه يا لوبنانيه 🎵</button>
					<button class="btn btn-primary" id="bannar_coming">علقي البلالين يا لوبنانيه  🎈</button>
					<button class="btn btn-primary" id="balloons_flying">طيّري ابلالين يا لوبنانيه 🎈</button>
					<button class="btn btn-primary" id="cake_fadein">جهّزي الكيك يا لوبنانيه 🎂</button>
					<button class="btn btn-primary" id="light_candle">ولّعي الشمع يا لوبنانيه 🔥</button>
					<button class="btn btn-primary" id="wish_message">عيد ميلاد سعيد ملاكيي 🎉</button>
					<button class="btn btn-primary" id="story">اضغطي هنا  💌</button>
				</div>
			</div>
		</div>

	</div>
</body>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.1/js/bootstrap.min.js"></script>
<script src="effect.js"></script>

<script>
	// كود ربط إظهار الصور الأربعة المعلقة فور الضغط على زر "اضغطي هنا 💌"
	$(document).ready(function(){
		$('#story').click(function(){
			setTimeout(function(){
				$('.corner-photo').addClass('show-photo');
			}, 3000);
		});
	});
</script>
</html>
